<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tu CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Pastelería 1000 Sabores</title>
</head>
<body>
<header>
  <div class="container">
    <div class="brand">🍰 1000 Sabores</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="carrito.html">Carrito</a>
      <a href="blog.html">Blog</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html">Login</a>
      <a href="registro.html">Registro</a>
    </nav>
  </div>
</header>

<main class="container">

  <!-- Bienvenida con separación extra -->
  <section class="grid home-intro">
    <div class="kpi">
      <strong>Bienvenido</strong> a la Pastelería 1000 Sabores. Explora nuestras tortas y postres.
    </div>
  </section>

  <!-- Destacados  -->
  <section>
    <h2 class="home-title">Destacados</h2>
    <div id="destacados" class="grid cards home-grid"></div>
  </section>

</main>

<footer>
  <div class="container">© 2025 Pastelería 1000 Sabores — Demo EP1</div>
</footer>

<script src="assets/js/data.products.js"></script>
<script src="assets/js/data.regiones.js"></script>
<script src="assets/js/main.js"></script>

<!-- Ajuste de Destacados -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const box = document.getElementById('destacados');
    if (!box || typeof getProducts !== 'function') return;

    const all = getProducts();

    
    const base = all.slice(0, 3);

    
    const circulares = all
      .filter(p => p.categoria === 'Tortas Circulares')
      .slice(0, 2);

    // 3) Une y quita duplicados por código
    const seen = new Set();
    const items = [...base, ...circulares].filter(p => {
      if (seen.has(p.codigo)) return false;
      seen.add(p.codigo);
      return true;
    });

    // 4) Render con la misma cardHtml de tu main.js
    box.innerHTML = items.map(p => (typeof cardHtml === 'function'
      ? cardHtml(p)
      : `
        <article class="card">
          <img class="img-fluid" src="${p.img || 'assets/img/placeholder.png'}" alt="${p.nombre}"
               onerror="this.src='assets/img/placeholder.png'">
          <div class="badge">${p.categoria}</div>
          <h3>${p.nombre}</h3>
          <div>$${p.precio.toLocaleString('es-CL')}</div>
          <button class="btn" data-add="${p.codigo}">Añadir</button>
        </article>
      `)
    ).join('');
  });
</script>
</body>
</html>
