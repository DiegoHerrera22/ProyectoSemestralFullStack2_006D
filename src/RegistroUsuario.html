<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Formativa Fullstack 2</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="position-absolute top-0 end-0 p-3-mb-2">
        <span>¿Ya tienes una cuenta? </span>
        <a href="InicioSesion.html" class="text-decoration-none">ingresa aqui →</a>
    </div>
</header>
    <div class = "container mt-4">
        <div class = "row">
            <div class = "col-12  col-md-6 offset-md-3 col-lg-4 offset-lg-4">
                <h2>Registro de Usuario</h2>
                <div class = "mb-3 mt-4" >
                    <label for="name-input" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="name-input" placeholder="Juanito Fulano">
                </div>
                <div class = "mb-3 ">
                    <label for="email-input" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="email-input" placeholder="@gmail.com">
                </div>
                <div class = "mb-3 ">
                    <label for="password-input" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password-input" placeholder="******">
                </div>
                <div class = "mb-3">
                    <label for="confirm-password-input" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirm-password-input" placeholder="******">
                </div>
                <div class = "mb-3">
                    <label for="Cellphone-input" class="form-label">Número de telefono</label>
                    <div class="input-group mb-3">
                        <span class = "input-group-text">+56 9</span>
                        <input type="number" class="form-control" id="Cellphone-input" placeholder="123456789">
                    </div>
                </div>
                <button id = "RegistrarUsuario" type="button" class = "btn btn-primary w-100">Registrar Usuario</button>

            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
