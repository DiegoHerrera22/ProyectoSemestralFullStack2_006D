<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<title>Admin — Usuarios</title>
</head>
<body>
<header>
  <div class="container d-flex justify-content-between align-items-center py-3">
    <div class="brand">🔐 Admin — 1000 Sabores</div>
    <nav class="d-flex gap-3">
      <a href="index.html">Dashboard</a>
      <a href="productos.html">Productos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="../index.html">Sitio</a>
    </nav>
  </div>
</header>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Usuarios</h2>
    <a class="btn btn-pink" href="../registro.html?from=admin">Nuevo usuario</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>RUN</th>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Correo</th>
          <th>Tipo</th>
          <th>Región</th>
          <th>Comuna</th>
          <th style="width:140px">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbody-users"></tbody>
    </table>
  </div>
</main>

<footer><div class="container py-3">Panel administrativo</div></footer>

<script>
  const LS_USERS_KEY='users';
  const getUsers = ()=> JSON.parse(localStorage.getItem(LS_USERS_KEY)||'[]');
  const setUsers = (arr)=> localStorage.setItem(LS_USERS_KEY, JSON.stringify(arr));

  function paint(){
    const tb = document.getElementById('tbody-users');
    const rows = getUsers().map(u=>`
      <tr>
        <td>${u.run||''}</td>
        <td>${u.nombres||''}</td>
        <td>${u.apellidos||''}</td>
        <td>${u.email||''}</td>
        <td>${u.tipo||'Cliente'}</td>
        <td>${u.region||''}</td>
        <td>${u.comuna||''}</td>
        <td class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-primary" href="../registro.html?from=admin&email=${encodeURIComponent(u.email||'')}">Editar</a>
          <button class="btn btn-sm btn-outline-danger" data-del="${u.email}">Eliminar</button>
        </td>
      </tr>`).join('');
    tb.innerHTML = rows || `<tr><td colspan="8" class="text-muted">Sin usuarios</td></tr>`;
  }

  document.addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-del]');
    if(!btn) return;
    const email = btn.getAttribute('data-del');
    if(confirm('¿Eliminar usuario?\n' + email)){
      const users = getUsers().filter(u => (u.email||'').toLowerCase() !== (email||'').toLowerCase());
      setUsers(users);
      paint();
    }
  });

  document.addEventListener('DOMContentLoaded', paint);
</script>

<script src="../assets/js/data.products.js"></script>
<script src="../assets/js/data.regiones.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
