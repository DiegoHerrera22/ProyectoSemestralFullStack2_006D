<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../assets/css/style.css">
<title>Admin — Pastelería 1000 Sabores</title>
</head>
<body>
<header>
  <div class="container">
    <div class="brand">🔐 Admin — 1000 Sabores</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="productos.html">Productos</a>
      <a href="../index.html">Sitio</a>
    </nav>
  </div>
</header>
<main class="container">

<h2>Nuevo producto</h2>
<form id="form-prod" class="form">
  <label>Código</label><input id="p-codigo" required minlength="3">
  <label>Nombre</label><input id="p-nombre" required maxlength="100">
  <label>Descripción (opcional)</label><textarea id="p-desc" maxlength="500"></textarea>
  <label>Categoría</label><select id="p-cat" required></select>
  <label>Precio</label><input id="p-precio" type="number" min="0" step="1" required>
  <label>Stock</label><input id="p-stock" type="number" min="0" step="1" required>
  <label>Stock crítico (opcional)</label><input id="p-crit" type="number" min="0" step="1">
  <button class="btn" type="submit">Guardar</button>
</form>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const sel = document.getElementById('p-cat');
  window.CATEGORIAS.forEach(c=>{const o=document.createElement('option');o.textContent=c;sel.appendChild(o)});
  document.getElementById('form-prod').addEventListener('submit',(e)=>{
    e.preventDefault();
    const nuevo = {
      codigo: document.getElementById('p-codigo').value.trim(),
      nombre: document.getElementById('p-nombre').value.trim(),
      descripcion: document.getElementById('p-desc').value.trim(),
      categoria: document.getElementById('p-cat').value,
      precio: Number(document.getElementById('p-precio').value),
      stock: Number(document.getElementById('p-stock').value),
      stock_critico: document.getElementById('p-crit').value === '' ? null : Number(document.getElementById('p-crit').value)
    };
    const ok = window.validateProduct(nuevo, true);
    if(!ok.valid){ alert(ok.message); return; }
    window.createProduct(nuevo);
    location.href='productos.html';
  });
});
</script>

</main>
<footer><div class="container">Panel administrativo</div></footer>
<script src="../assets/js/data.products.js"></script>
<script src="../assets/js/data.regiones.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
