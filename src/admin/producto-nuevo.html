<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastelería 1000 Sabores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">1000 Sabores</a>
      <nav class="nav">
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html" id="menu-login">Iniciar sesión</a>
        <a href="registro.html" id="menu-registro">Registrarse</a>
        <a href="carrito.html" id="menu-carrito">Carrito (<span id="cart-count">0</span>)</a>
        <a href="admin/index.html" id="menu-admin" class="admin-only hidden">Admin</a>
      </nav>
    </div>
  </header>
  <main class="container">

    <h1>Nuevo producto</h1>
    <form id="form-producto" novalidate>
      <label>Código
        <input name="codigo" required minlength="3">
      </label>
      <label>Nombre
        <input name="nombre" required maxlength="100">
      </label>
      <label>Descripción
        <textarea name="descripcion" maxlength="500"></textarea>
      </label>
      <label>Precio
        <input name="precio" type="number" step="0.01" min="0" required>
      </label>
      <label>Stock
        <input name="stock" type="number" min="0" step="1" required>
      </label>
      <label>Stock crítico
        <input name="stock_critico" type="number" min="0" step="1">
      </label>
      <label>Categoría
        <select name="categoria" id="sel-categoria" required></select>
      </label>
      <button class="btn" type="submit">Guardar</button>
    </form>

  </main>
  <footer class="site-footer">
    <div class="container">
      <small>&copy; 2025 Pastelería 1000 Sabores</small>
    </div>
  </footer>
  <script src="../assets/js/data.regiones.js"></script>
  <script src="../assets/js/data.products.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/validators.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
