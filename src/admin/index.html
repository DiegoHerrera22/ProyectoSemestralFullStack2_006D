<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../assets/css/style.css">
<title>Admin — Pastelería 1000 Sabores</title>
</head>
<body>
<header>
  <div class="container">
    <div class="brand">🔐 Admin — 1000 Sabores</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="productos.html">Productos</a>
      <a href="../index.html">Sitio</a>
    </nav>
  </div>
</header>
<main class="container">

<h2>Dashboard</h2>
<div class="grid">
  <div class="kpi"><strong>Productos</strong>: <span id="kpi-prod">0</span></div>
  <div class="kpi"><strong>Stock bajo</strong>: <span id="kpi-low">0</span></div>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const prods = window.getProducts();
  document.getElementById('kpi-prod').textContent = prods.length;
  const low = prods.filter(p=> (p.stock_critico ?? 0) > 0 && p.stock <= p.stock_critico).length;
  document.getElementById('kpi-low').textContent = low;
});
</script>

</main>
<footer><div class="container">Panel administrativo</div></footer>
<script src="../assets/js/data.products.js"></script>
<script src="../assets/js/data.regiones.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
