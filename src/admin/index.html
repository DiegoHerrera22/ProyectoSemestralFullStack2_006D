<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos del proyecto -->
  <link rel="stylesheet" href="../assets/css/style.css" />

  <title>Admin — Pastelería 1000 Sabores</title>
</head>
<body>
  <header>
    <div class="container d-flex align-items-center justify-content-between">
      <div class="brand">🔐 Admin — 1000 Sabores</div>
      <nav class="d-flex gap-3">
        <a href="index.html" class="active">Dashboard</a>
        <a href="productos.html">Productos</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="../index.html">Sitio</a>
      </nav>
    </div>
  </header>

  <main class="container my-4">
    <h2 class="mb-3">Dashboard</h2>

    <!-- KPIs con Bootstrap -->
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-4">
        <div class="kpi d-flex justify-content-between align-items-center">
          <strong>Productos</strong>
          <span id="kpi-prod">0</span>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="kpi d-flex justify-content-between align-items-center">
          <strong>Stock bajo</strong>
          <span id="kpi-low">0</span>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="kpi d-flex justify-content-between align-items-center">
          <strong>Usuarios</strong>
          <span id="kpi-users">0</span>
        </div>
      </div>
    </div>

    <!-- Acciones rápidas -->
    <div class="card p-3 mb-4">
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-pink" href="producto-nuevo.html">➕ Nuevo producto</a>
        <a class="btn btn-pink" href="productos.html">📦 Ver productos</a>
        <a class="btn btn-pink" href="../registro.html?from=admin">👤 Registrar usuario</a>
        <a class="btn btn-pink" href="usuarios.html">👥 Ver usuarios</a>
      </div>
    </div>

    <!-- Resumen de stock crítico -->
    <div class="card p-3">
      <h3 class="mb-3">Productos con stock crítico</h3>
      <div class="table-responsive">
        <table class="table" id="tabla-low">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Stock</th>
              <th>Crítico</th>
              <th></th>
            </tr>
          </thead>
          <tbody><!-- se llena por JS --></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">Panel administrativo</div>
  </footer>

  <!-- Datos + lógica del proyecto -->
  <script src="../assets/js/data.products.js"></script>
  <script src="../assets/js/data.regiones.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- Bootstrap JS  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Poblado de KPIs y tabla de críticos -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prods = window.getProducts ? window.getProducts() : [];

      // KPIs
      const lowItems = prods.filter(p => (p.stock_critico ?? 0) > 0 && p.stock <= p.stock_critico);
      document.getElementById('kpi-prod').textContent = prods.length;
      document.getElementById('kpi-low').textContent = lowItems.length;

      const users = window.getUsers ? window.getUsers() : [];
      document.getElementById('kpi-users').textContent = users.length;

      // Tabla de críticos (máx 10)
      const tbody = document.querySelector('#tabla-low tbody');
      if (tbody) {
        tbody.innerHTML = lowItems.slice(0, 10).map(p => `
          <tr class="stock-low">
            <td>${p.codigo}</td>
            <td>${p.nombre}</td>
            <td>${p.categoria}</td>
            <td>${p.stock}</td>
            <td>${p.stock_critico ?? ''}</td>
            <td>
              <a class="btn btn-sm btn-pink" href="producto-editar.html?codigo=${encodeURIComponent(p.codigo)}">Editar</a>
            </td>
          </tr>
        `).join('') || `<tr><td colspan="6">Sin productos en nivel crítico 🎉</td></tr>`;
      }
    });
  </script>
</body>
</html>
