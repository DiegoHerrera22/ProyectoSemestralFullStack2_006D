<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <title>Admin — Pastelería 1000 Sabores</title>
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">🔐 Admin — 1000 Sabores</div>
      <nav>
        <a href="index.html" class="active">Dashboard</a>
        <a href="productos.html">Productos</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="../index.html">Sitio</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Dashboard</h2>

    <div class="grid" style="margin-bottom:16px;">
      <div class="kpi"><strong>Productos</strong>: <span id="kpi-prod">0</span></div>
      <div class="kpi"><strong>Stock bajo</strong>: <span id="kpi-low">0</span></div>
      <div class="kpi"><strong>Usuarios</strong>: <span id="kpi-users">0</span></div>
    </div>

    <div class="card" style="display:flex; gap:12px; flex-wrap:wrap;">
      <a class="btn" href="producto-nuevo.html">➕ Nuevo producto</a>
      <a class="btn" href="productos.html">📦 Ver productos</a>
      <a class="btn" href="../registro.html">👤 Registrar usuario</a>
      <a class="btn" href="usuarios.html">👥 Ver usuarios</a>
    </div>
  </main>

  <footer><div class="container">Panel administrativo</div></footer>

  <!-- Datos + lógica -->
  <script src="../assets/js/data.products.js"></script>
  <script src="../assets/js/data.regiones.js"></script>
  <script src="../assets/js/main.js"></script>

  
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      const prods = window.getProducts ? window.getProducts() : [];
      const low = prods.filter(p => (p.stock_critico ?? 0) > 0 && p.stock <= p.stock_critico).length;
      document.getElementById('kpi-prod').textContent = prods.length;
      document.getElementById('kpi-low').textContent = low;

      const users = window.getUsers ? window.getUsers() : [];
      document.getElementById('kpi-users').textContent = users.length;
    });
  </script>
</body>
</html>
