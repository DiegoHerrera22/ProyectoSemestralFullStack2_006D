<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Bootstrap  -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Tu CSS (tipografías y colores del caso) -->
<link rel="stylesheet" href="../assets/css/style.css">
<title>Admin — Pastelería 1000 Sabores</title>
</head>
<body>
<header>
  <div class="container d-flex justify-content-between align-items-center py-3">
    <div class="brand">🔐 Admin — 1000 Sabores</div>
    <nav class="d-flex gap-3">
      <a href="index.html">Dashboard</a>
      <a href="productos.html" class="active">Productos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="../index.html">Sitio</a>
    </nav>
  </div>
</header>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Productos (Admin)</h2>
    <a class="btn btn-pink" href="producto-nuevo.html">➕ Nuevo producto</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle" id="tabla-admin">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Crítico</th>
          <th style="width:160px"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<footer><div class="container py-3">Panel administrativo</div></footer>

<script>
  document.addEventListener('DOMContentLoaded', ()=>{
    const tbody = document.querySelector('#tabla-admin tbody');
    const prods = (window.getProducts ? window.getProducts() : []);

    tbody.innerHTML = prods.map(p=>{
      const crit = (p.stock_critico ?? -1);
      const isLow = crit >= 0 && p.stock <= crit;
      return `
        <tr class="${isLow ? 'table-danger' : ''}">
          <td>${p.codigo}</td>
          <td>${p.nombre}</td>
          <td>${p.categoria}</td>
          <td>$${Number(p.precio||0).toLocaleString('es-CL')}</td>
          <td>${p.stock}</td>
          <td>${crit >= 0 ? crit : ''}</td>
          <td class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-primary" href="producto-editar.html?codigo=${encodeURIComponent(p.codigo)}">Editar</a>
            <button class="btn btn-sm btn-outline-danger" data-del="${p.codigo}">Eliminar</button>
          </td>
        </tr>`;
    }).join('');

    tbody.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-del]');
      if(!btn) return;
      const codigo = btn.getAttribute('data-del');
      if(confirm('¿Eliminar producto ' + codigo + '?')){
        if(window.deleteProduct) window.deleteProduct(codigo);
        location.reload();
      }
    });
  });
</script>

<!-- Datos + lógica -->
<script src="../assets/js/data.products.js"></script>
<script src="../assets/js/data.regiones.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
