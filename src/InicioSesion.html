<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasteleria Mil Sabores</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="position-absolute top-0 end-0 p-3-mb-2">
        <span>¿No tienes una cuenta? </span>
        <a href="InicioSesion.html" class="text-decoration-none">ingresa aqui →</a>
    </div>
</header>
<div class = "container mt-5">
    <div class = "row">
        <div class = "col-12  col-md-6 offset-md-3 col-lg-4 offset-lg-4">
            <h2>Inicio de sesión</h2>
            <div class = "mb-3 mt-5">
                <label for="email-input" class="form-label">Correo</label>
                <input type="email" class="form-control" id="email-input" placeholder="@gmail.com">
            </div>
            <div class = "mb-3 ">
                <label for="password-input" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password-input" placeholder="******">
            </div>
            <button id = "IniciarSesion" type="button" class = "btn btn-primary w-100">Iniciar Sesión</button>
        </div>
    </div>
</div>
<script src="script.js"></script>

</html>
