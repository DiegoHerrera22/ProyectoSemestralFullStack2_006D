<h2>Contacto</h2>
<form id="form-contacto" class="form">
  <label>Nombre</label>
  <input id="c-nombre" required maxlength="100">
  <label>Correo (opcional)</label>
  <input id="c-correo" maxlength="100" placeholder="opcional@duoc.cl">
  <label>Comentario</label>
  <textarea id="c-comentario" required maxlength="500" rows="5" placeholder="Tu mensaje..."></textarea>
  <button class="btn" type="submit">Enviar</button>
  <div id="c-msg" class="alert" style="display:none;margin-top:10px"></div>
</form>
